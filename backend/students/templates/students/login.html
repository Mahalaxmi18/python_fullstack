
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Portal | Login</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #101b3f, #253c78, #5369b2);
    overflow: hidden;
}

/* Animated background circles */

.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    animation: float 7s infinite ease-in-out;
}

.circle.one {
    width: 250px;
    height: 250px;
    top: -70px;
    left: -50px;
}

.circle.two {
    width: 350px;
    height: 350px;
    bottom: -120px;
    right: -80px;
    animation-delay: 2s;
}

.circle.three {
    width: 100px;
    height: 100px;
    bottom: 20%;
    left: 15%;
    animation-delay: 1s;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-30px);
    }
}

/* Login box */

.login-container {
    position: relative;
    z-index: 2;
    width: 400px;
    padding: 45px 40px;
    background: rgba(255,255,255,0.96);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideUp 0.9s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(50px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    width: 65px;
    height: 65px;
    background: linear-gradient(135deg, #243b80, #7954d8);
    color: white;
    border-radius: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    margin: 0 auto 20px;
    box-shadow: 0 8px 20px rgba(65,75,160,0.3);
}

h1 {
    text-align: center;
    color: #172554;
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #78839b;
    margin-bottom: 30px;
    font-size: 14px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #263454;
    font-weight: 600;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dce2ef;
    border-radius: 9px;
    margin-bottom: 22px;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
    background: #f8faff;
}

input:focus {
    border-color: #5369b2;
    box-shadow: 0 0 0 4px rgba(83,105,178,0.12);
    background: white;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, #243b80, #7954d8);
    transition: all 0.3s ease;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(75,75,170,0.35);
}

button:active {
    transform: scale(0.98);
}

.error {
    background: #fff0f0;
    color: #d32f2f;
    padding: 12px;
    text-align: center;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #929bb0;
    font-size: 12px;
}

@media(max-width: 450px) {
    .login-container {
        width: 90%;
        padding: 35px 25px;
    }
}

</style>
</head>

<body>

<div class="circle one"></div>
<div class="circle two"></div>
<div class="circle three"></div>

<div class="login-container">

    <div class="logo">🎓</div>

    <h1>Student Portal</h1>

    <p class="subtitle">
        Welcome back! Login to access your account.
    </p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input type="text"
               name="username"
               placeholder="Enter your username"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit">Sign In →</button>

    </form>

    <div class="footer">
        © 2026 Student Management System
        <br><br>
        Secure Student Login
    </div>

</div>

</body>
</html>
